<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>មជ្ឈមណ្ឌលវីដេអូកម្សាន្ត</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding-bottom: 50px;
    }
    header {
      background-color: #111827;
      padding: 14px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #1f2937;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .container {
      width: 95%;
      max-width: 800px;
      margin: 15px auto;
    }

    /* ផ្ទាំងចាក់វីដេអូ */
    .player-section {
      display: none;
      background-color: #111827;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      margin-bottom: 25px;
      border: 1px solid #1f2937;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .player-title {
      font-size: 16px;
      color: #38bdf8;
      font-weight: bold;
    }
    .close-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 widescreen */
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ផ្ទាំងពាណិជ្ជកម្ម Overlay */
    #adOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 10px;
    }
    .ad-banner-box {
      width: 90%;
      max-width: 320px;
      min-height: 120px;
      background-color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #4b5563;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .skip-btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      display: none;
      font-weight: bold;
    }
    .skip-btn:hover {
      background-color: #1d4ed8;
    }
    .timer-text {
      font-size: 14px;
      color: #9ca3af;
    }

    /* បញ្ជីកាតវីដេអូ */
    .catalog-title {
      font-size: 17px;
      margin-bottom: 14px;
      color: #f3f4f6;
      font-weight: bold;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .video-card {
      background-color: #111827;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #1f2937;
    }
    .card-thumb {
      width: 100%;
      height: 100px;
      background-color: #374151;
      object-fit: cover;
      display: block;
    }
    .card-info {
      padding: 10px;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 11px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <header>🎬 មជ្ឈមណ្ឌលវីដេអូកម្សាន្ត</header>

  <div class="container">

    <!-- ផ្ទាំងចាក់វីដេអូ -->
    <div class="player-section" id="playerSection">
      <div class="player-header">
        <div class="player-title" id="activeVideoTitle">កំពុងចាក់...</div>
        <button class="close-btn" onclick="closePlayer()">✕ បិទ</button>
      </div>

      <div class="video-wrapper">
        <div id="adOverlay">
          <div class="ad-banner-box" id="adContainer">
            <!-- ត្រង់នេះជាកន្លែងដាក់កូដពាណិជ្ជកម្មពិត -->
            <p style="color: #9ca3af; font-size: 13px;">[ ផ្ទាំងពាណិជ្ជកម្ម ]</p>
          </div>
          <div class="timer-text" id="timerNotice">ពាណិជ្ជកម្មនឹងចប់ក្នុងរយៈពេល <span id="countdown">5</span> វិនាទី...</div>
          <button class="skip-btn" id="skipButton" onclick="skipAd()">ចូលទស្សនាវីដេអូ ⏩</button>
        </div>

        <!-- បន្ថែម allowfullscreen ពេញលេញ -->
        <iframe id="mainPlayer" src="" allow="autoplay; fullscreen" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
      </div>
    </div>

    <!-- បញ្ជីវីដេអូ -->
    <div class="catalog-title">📺 ជ្រើសរើសវីដេអូដែលអ្នកចង់ទស្សនា៖</div>
    
    <div class="video-grid">
      <!-- វីដេអូ ទី ១ -->
      <div class="video-card" onclick="playSelectedVideo('វីដេអូភាគពិសេស ទី ១', 'https://drive.google.com/file/d/1tn7W9nxL7vFTPrcRzk5fuYldwqSUIO1p/preview')">
        <img class="card-thumb" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80" alt="Thumb">
        <div class="card-info">
          <div class="card-title">វីដេអូភាគពិសេស ទី ១</div>
          <div class="card-desc">ចុចដើម្បីទស្សនាវីដេអូពេញ</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let timer;
    let secondsLeft = 5;
    const playerSection = document.getElementById("playerSection");
    const activeVideoTitle = document.getElementById("activeVideoTitle");
    const mainPlayer = document.getElementById("mainPlayer");
    const adOverlay = document.getElementById("adOverlay");
    const timerNotice = document.getElementById("timerNotice");
    const countdownEl = document.getElementById("countdown");
    const skipBtn = document.getElementById("skipButton");

    function playSelectedVideo(title, url) {
      activeVideoTitle.innerText = "📌 " + title;
      mainPlayer.src = url;
      playerSection.style.display = "block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });

      clearInterval(timer);
      secondsLeft = 5;
      countdownEl.innerText = secondsLeft;
      timerNotice.style.display = "block";
      skipBtn.style.display = "none";
      adOverlay.style.display = "flex";

      timer = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          countdownEl.innerText = secondsLeft;
        } else {
          clearInterval(timer);
          timerNotice.style.display = "none";
          skipBtn.style.display = "inline-block";
        }
      }, 1000);
    }

    function skipAd() {
      adOverlay.style.display = "none";
    }

    function closePlayer() {
      mainPlayer.src = "";
      playerSection.style.display = "none";
      clearInterval(timer);
    }
  </script>
</body>
</html>
